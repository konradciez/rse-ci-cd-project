name: Unit Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
            python-version: '3.10'
            
      - run: pip install .[test]
      - run: pytest tests/
      
